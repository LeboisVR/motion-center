; PlatformIO project configuration for competition-control-box-v1.8
; Place this file inside the firmware folder so PIO treats that folder
; as the project root and finds the .ino and .h files correctly.

[platformio]
src_dir = .

; ── Box V2 (WS2812 LED, 6 actuators) — default ──────────────────────────────
[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
    -I.
    -I../shared

; ── Box V1 (single LED on A5, 5 actuators max) ─────────────────────────────
; A2/A3 are button pins on V1 hardware, NOT motor step/dir pins.
; Produces: .pio/build/leonardo_box_v1/firmware.hex
[env:leonardo_box_v1]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
    -I.
    -I../shared
    -DBOX_VERSION=1
    -DMAX_ACTUATORS=5

; ── Debug V2 (Serial1 UART) ──────────────────────────────────────────────────
; Activer le debug UART sur Serial1 (pins 0/1). Flasher uniquement pour debug,
; jamais pour la production (coût flash +~10% selon les messages activés).
[env:leonardo_debug]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
    -I.
    -I../shared
    -DDEBUG

[env:leonardo_box_v1_debug]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
    -I.
    -I../shared
    -DBOX_VERSION=1
    -DMAX_ACTUATORS=5
    -DDEBUG
