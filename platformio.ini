; PlatformIO project configuration for competition-control-box-v1.8
; This setup treats the project root as the source folder so existing
; .ino/.cpp/.h files at the repo root are discovered without moving files.
; Change 'board' to your exact board if different from Arduino Leonardo.

[platformio]
src_dir = firmware hardware/competition-control-box-v2.1

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino

; Use project root as source directory so existing files are found
src_dir = .

; Add current directory to include path (helps with quoted includes)
; Add MAX_ACTUATORS via build_flags to produce specific hex builds.
build_flags = -I. -I"firmware hardware/shared" -D MAX_ACTUATORS=6

; Optional: increase verbosity when debugging build issues
; build_unflags = -w
